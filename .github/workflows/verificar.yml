name: Verificar la plantilla

# Se corre en cada cambio, a mano cuando se quiera, y una vez por semana: una
# versión nueva de Python o de una herramienta puede romper la plantilla sin
# que nadie haya tocado nada, y es mejor enterarse por este rojo que por el
# primer lector que la clone.
# ⚠️ En un repositorio público, GitHub apaga solo la corrida programada si el
# repositorio pasa 60 días sin actividad; hay que volver a encenderla a mano.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1" # lunes 13:17 UTC (7:17 en la Ciudad de México)

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14: la versión de la plantilla. 3.12: la que trae Linux Mint 22.
        python: ["3.12", "3.14"]
    name: Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Un entorno virtual también aquí: es la costumbre que la plantilla enseña.
      # pip se actualiza porque --group pide pip 25.1 o más nuevo.
      - name: Herramientas de desarrollo
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --group dev

      - name: Estilo (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Tipos (mypy estricto)
        run: .venv/bin/mypy

      # Lo que cuenta: las pruebas contra el paquete INSTALADO, en un entorno
      # nuevo, como lo recibiría cualquiera. El guion cuenta las pruebas desde
      # el informe de pytest y se pone rojo si alguna no pasó.
      - name: Pruebas contra lo instalado
        run: bash herramientas/probar-instalado.sh
        env:
          PYTHON: python

      # La frontera que sabe fallar: un módulo fuera del paquete TIENE que
      # faltarle a lo instalado, y la prueba que lo usa TIENE que fallar por
      # esa razón exacta. Si alguna vez pasa, este paso se pone rojo.
      - name: Frontera de src/ (lo que no está en el paquete no viaja)
        run: bash herramientas/probar-frontera.sh
        env:
          PYTHON: python
